<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="dt dd"><style>
/* Layout: one diagram, centred, full width on a phone. Same green family as the paper. */
:root{
  --bg:#f5f6f3; --ink:#1b211d; --muted:#5d6760; --line:#8a948c;
  --rule-fill:#ece9fb; --rule-stroke:#5b4fb8; --rule-ink:#2e2770;
  --check-fill:#e1f3ec; --check-stroke:#0f6e56; --check-ink:#08443a;
  --agent-fill:#fbeae4; --agent-stroke:#a8452a; --agent-ink:#5e2414;
  --neutral-fill:#eceeea; --neutral-stroke:#7b847d; --neutral-ink:#1b211d;
  --gap-fill:#faeeda; --gap-stroke:#9a5b0d; --gap-ink:#5a3406;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}}
:root[data-theme="dark"]{--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}
.gap rect{fill:var(--gap-fill);stroke:var(--gap-stroke)} .gap text{fill:var(--gap-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{font-size:17px;font-weight:600}
.s{font-size:14px}
.rule rect{fill:var(--rule-fill);stroke:var(--rule-stroke)} .rule text{fill:var(--rule-ink)}
.check rect{fill:var(--check-fill);stroke:var(--check-stroke)} .check text{fill:var(--check-ink)}
.agent rect{fill:var(--agent-fill);stroke:var(--agent-stroke)} .agent text{fill:var(--agent-ink)}
.neutral rect{fill:var(--neutral-fill);stroke:var(--neutral-stroke)} .neutral text{fill:var(--neutral-ink)}
.wire{fill:none;stroke:var(--line);stroke-width:1.5}
.legend{fill:var(--muted);font-size:13px}

text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
:root{background:var(--bg)}
</style><rect width="100%" height="100%" fill="var(--bg)"/><title id="dt">Ordinal software engineering</title><desc id="dd">In the second order, engineers build the factory: the bar, the rules and the checks. The factory holds every agent to the bar. In the first order, agents build the software, which is spot-checked; each find becomes a new clause in the factory. Agents are temporary; the order persists and owns the work.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="neutral"><rect x="20" y="20" width="580" height="150" rx="10" stroke-width="1"/><text class="t" x="40" y="46" dominant-baseline="central">Second order · engineers build the factory</text></g><g class="rule"><rect x="40" y="78" width="170" height="64" rx="8" stroke-width="1"/><text class="t" x="125.0" y="100" text-anchor="middle" dominant-baseline="central">The bar</text><text class="s" x="125.0" y="122" text-anchor="middle" dominant-baseline="central">Frozen intent</text></g><g class="rule"><rect x="225" y="78" width="170" height="64" rx="8" stroke-width="1"/><text class="t" x="310.0" y="100" text-anchor="middle" dominant-baseline="central">The rules</text><text class="s" x="310.0" y="122" text-anchor="middle" dominant-baseline="central">What proven means</text></g><g class="check"><rect x="410" y="78" width="170" height="64" rx="8" stroke-width="1"/><text class="t" x="495.0" y="100" text-anchor="middle" dominant-baseline="central">The checks</text><text class="s" x="495.0" y="122" text-anchor="middle" dominant-baseline="central">Run on every item</text></g><g class="neutral"><rect x="20" y="236" width="580" height="150" rx="10" stroke-width="1"/><text class="t" x="40" y="262" dominant-baseline="central">First order · agents build the software</text></g><g class="agent"><rect x="40" y="294" width="170" height="64" rx="8" stroke-width="1"/><text class="t" x="125.0" y="316" text-anchor="middle" dominant-baseline="central">Agents</text><text class="s" x="125.0" y="338" text-anchor="middle" dominant-baseline="central">Come and go</text></g><g class="check"><rect x="225" y="294" width="170" height="64" rx="8" stroke-width="1"/><text class="t" x="310.0" y="316" text-anchor="middle" dominant-baseline="central">Software</text><text class="s" x="310.0" y="338" text-anchor="middle" dominant-baseline="central">Proven work</text></g><g class="gap"><rect x="410" y="294" width="170" height="64" rx="8" stroke-width="1"/><text class="t" x="495.0" y="316" text-anchor="middle" dominant-baseline="central">Spot checks</text><text class="s" x="495.0" y="338" text-anchor="middle" dominant-baseline="central">Find what is wrong</text></g><path class="wire" d="M210 326 L223 326" marker-end="url(#arrow)"/><path class="wire" d="M395 326 L408 326" marker-end="url(#arrow)"/><path class="wire" d="M310 170 L310 234" marker-end="url(#arrow)"/><text class="legend" x="322" y="203" dominant-baseline="central">Holds every agent to the bar</text><path class="wire" d="M580 326 L640 326 L640 110 L602 110" marker-end="url(#arrow)"/><text class="legend" x="652" y="218" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 652 218)">Each find becomes a new clause</text><text class="legend" x="310" y="412" text-anchor="middle" dominant-baseline="central">Agents are temporary; the order persists and owns the work</text></svg>
