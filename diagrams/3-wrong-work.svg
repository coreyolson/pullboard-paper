<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" role="img" aria-labelledby="wt wd"><style>
/* Layout: one diagram, centred, full width on a phone. Same green family as the paper. */
:root{
  --bg:#f5f6f3; --ink:#1b211d; --muted:#5d6760; --line:#8a948c;
  --rule-fill:#ece9fb; --rule-stroke:#5b4fb8; --rule-ink:#2e2770;
  --check-fill:#e1f3ec; --check-stroke:#0f6e56; --check-ink:#08443a;
  --agent-fill:#fbeae4; --agent-stroke:#a8452a; --agent-ink:#5e2414;
  --neutral-fill:#eceeea; --neutral-stroke:#7b847d; --neutral-ink:#1b211d;
  --gap-fill:#faeeda; --gap-stroke:#9a5b0d; --gap-ink:#5a3406;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}}
:root[data-theme="dark"]{--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}
.gap rect{fill:var(--gap-fill);stroke:var(--gap-stroke)} .gap text{fill:var(--gap-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{font-size:17px;font-weight:600}
.s{font-size:14px}
.rule rect{fill:var(--rule-fill);stroke:var(--rule-stroke)} .rule text{fill:var(--rule-ink)}
.check rect{fill:var(--check-fill);stroke:var(--check-stroke)} .check text{fill:var(--check-ink)}
.agent rect{fill:var(--agent-fill);stroke:var(--agent-stroke)} .agent text{fill:var(--agent-ink)}
.neutral rect{fill:var(--neutral-fill);stroke:var(--neutral-stroke)} .neutral text{fill:var(--neutral-ink)}
.wire{fill:none;stroke:var(--line);stroke-width:1.5}
.legend{fill:var(--muted);font-size:13px}

text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
:root{background:var(--bg)}
</style><rect width="100%" height="100%" fill="var(--bg)"/><title id="wt">Where wrong work goes</title><desc id="wd">A clause in English becomes one frozen test, reviewed against the clause. The builder is untrusted. Red before and green after sends wrong work back. A mutation check exposes weak tests. Someone other than the builder must review it. Only two escapes remain: a gap in the bar, which goes to the person, and a weak test, which goes back to be strengthened. Fast recovery sits under everything.</desc>
<defs><marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="rule"><rect x="60" y="20" width="260" height="60" rx="8" stroke-width="1"/><text class="t" x="190" y="42" text-anchor="middle" dominant-baseline="central">Clause, in English</text><text class="s" x="190" y="63" text-anchor="middle" dominant-baseline="central">One fact, the person's words</text></g>
<path class="wire" d="M320 50 L358 50" marker-end="url(#arrow3)"/>
<g class="rule"><rect x="360" y="20" width="260" height="60" rx="8" stroke-width="1"/><text class="t" x="490" y="42" text-anchor="middle" dominant-baseline="central">Test that encodes it</text><text class="s" x="490" y="63" text-anchor="middle" dominant-baseline="central">Read once, frozen, reviewed</text></g>
<path class="wire" d="M490 80 L490 102 L340 102 L340 120" marker-end="url(#arrow3)"/>
<g class="agent"><rect x="200" y="122" width="280" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="144" text-anchor="middle" dominant-baseline="central">Builder writes the change</text><text class="s" x="340" y="165" text-anchor="middle" dominant-baseline="central">Untrusted</text></g>
<path class="wire" d="M340 182 L340 210" marker-end="url(#arrow3)"/>
<g class="check"><rect x="160" y="212" width="360" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="234" text-anchor="middle" dominant-baseline="central">Red before, green after</text><text class="s" x="340" y="255" text-anchor="middle" dominant-baseline="central">Wrong work is sent back</text></g>
<path class="wire" d="M340 272 L340 300" marker-end="url(#arrow3)"/>
<g class="check"><rect x="160" y="302" width="360" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="324" text-anchor="middle" dominant-baseline="central">Mutation check</text><text class="s" x="340" y="345" text-anchor="middle" dominant-baseline="central">Where used: weak tests score low</text></g>
<path class="wire" d="M340 362 L340 390" marker-end="url(#arrow3)"/>
<g class="check"><rect x="160" y="392" width="360" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="414" text-anchor="middle" dominant-baseline="central">Independent review</text><text class="s" x="340" y="435" text-anchor="middle" dominant-baseline="central">Not the builder</text></g>
<path class="wire" d="M340 452 L340 474 M190 474 L490 474"/>
<path class="wire" d="M190 474 L190 496" marker-end="url(#arrow3)"/>
<path class="wire" d="M490 474 L490 496" marker-end="url(#arrow3)"/>
<g class="gap"><rect x="60" y="498" width="260" height="60" rx="8" stroke-width="1"/><text class="t" x="190" y="520" text-anchor="middle" dominant-baseline="central">Escape: bar gap</text><text class="s" x="190" y="541" text-anchor="middle" dominant-baseline="central">Back to the person</text></g>
<g class="gap"><rect x="360" y="498" width="260" height="60" rx="8" stroke-width="1"/><text class="t" x="490" y="520" text-anchor="middle" dominant-baseline="central">Escape: weak test</text><text class="s" x="490" y="541" text-anchor="middle" dominant-baseline="central">Back to be strengthened</text></g>
<path class="wire" d="M190 558 L190 580 M490 558 L490 580 M190 580 L490 580"/>
<path class="wire" d="M340 580 L340 606" marker-end="url(#arrow3)"/>
<g class="neutral"><rect x="200" y="608" width="280" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="630" text-anchor="middle" dominant-baseline="central">Fast recovery</text><text class="s" x="340" y="651" text-anchor="middle" dominant-baseline="central">Revert through the lander</text></g>
<text class="legend" x="340" y="700" text-anchor="middle">Amber: the two expected escapes, each with an owner</text>
</svg>