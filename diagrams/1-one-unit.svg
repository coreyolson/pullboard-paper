<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" role="img" aria-labelledby="dt dd"><style>
/* Layout: one diagram, centred, full width on a phone. Same green family as the paper. */
:root{
  --bg:#f5f6f3; --ink:#1b211d; --muted:#5d6760; --line:#8a948c;
  --rule-fill:#ece9fb; --rule-stroke:#5b4fb8; --rule-ink:#2e2770;
  --check-fill:#e1f3ec; --check-stroke:#0f6e56; --check-ink:#08443a;
  --agent-fill:#fbeae4; --agent-stroke:#a8452a; --agent-ink:#5e2414;
  --neutral-fill:#eceeea; --neutral-stroke:#7b847d; --neutral-ink:#1b211d;
  --gap-fill:#faeeda; --gap-stroke:#9a5b0d; --gap-ink:#5a3406;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}}
:root[data-theme="dark"]{--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}
.gap rect{fill:var(--gap-fill);stroke:var(--gap-stroke)} .gap text{fill:var(--gap-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{font-size:17px;font-weight:600}
.s{font-size:14px}
.rule rect{fill:var(--rule-fill);stroke:var(--rule-stroke)} .rule text{fill:var(--rule-ink)}
.check rect{fill:var(--check-fill);stroke:var(--check-stroke)} .check text{fill:var(--check-ink)}
.agent rect{fill:var(--agent-fill);stroke:var(--agent-stroke)} .agent text{fill:var(--agent-ink)}
.neutral rect{fill:var(--neutral-fill);stroke:var(--neutral-stroke)} .neutral text{fill:var(--neutral-ink)}
.wire{fill:none;stroke:var(--line);stroke-width:1.5}
.legend{fill:var(--muted);font-size:13px}

text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
:root{background:var(--bg)}
</style><rect width="100%" height="100%" fill="var(--bg)"/><title id="dt">How Pullboard makes work proven</title><desc id="dd">The person validates the bar; its tests are frozen before the code. An untrusted builder writes the change. Each test must fail before the change and pass on the exact tree that lands, and someone other than the builder must review it. When nothing is lacking the unit is proven, and it lands with a receipt anyone can re-check.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="neutral"><rect x="230" y="20" width="220" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="42" text-anchor="middle" dominant-baseline="central">The person · validates</text><text class="s" x="340" y="63" text-anchor="middle" dominant-baseline="central">Is the bar correct?</text></g>
<path class="wire" d="M340 80 L340 102 L190 102 L190 122" marker-end="url(#arrow)"/>
<g class="rule"><rect x="60" y="124" width="260" height="60" rx="8" stroke-width="1"/><text class="t" x="190" y="146" text-anchor="middle" dominant-baseline="central">Frozen bar</text><text class="s" x="190" y="167" text-anchor="middle" dominant-baseline="central">Tests frozen before code</text></g>
<g class="agent"><rect x="360" y="124" width="260" height="60" rx="8" stroke-width="1"/><text class="t" x="490" y="146" text-anchor="middle" dominant-baseline="central">Builder</text><text class="s" x="490" y="167" text-anchor="middle" dominant-baseline="central">Untrusted, writes the change</text></g>
<path class="wire" d="M190 184 L190 210 M490 184 L490 210 M140 210 L540 210"/>
<path class="wire" d="M140 210 L140 234" marker-end="url(#arrow)"/>
<path class="wire" d="M340 210 L340 234" marker-end="url(#arrow)"/>
<path class="wire" d="M540 210 L540 234" marker-end="url(#arrow)"/>
<g class="check"><rect x="50" y="236" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="140" y="258" text-anchor="middle" dominant-baseline="central">Red before</text><text class="s" x="140" y="279" text-anchor="middle" dominant-baseline="central">Fails before change</text></g>
<g class="check"><rect x="250" y="236" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="258" text-anchor="middle" dominant-baseline="central">Green after</text><text class="s" x="340" y="279" text-anchor="middle" dominant-baseline="central">Passes on exact tree</text></g>
<g class="check"><rect x="450" y="236" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="540" y="258" text-anchor="middle" dominant-baseline="central">Independent review</text><text class="s" x="540" y="279" text-anchor="middle" dominant-baseline="central">Not the builder</text></g>
<path class="wire" d="M140 296 L140 322 M540 296 L540 322 M140 322 L540 322"/>
<path class="wire" d="M340 296 L340 346" marker-end="url(#arrow)"/>
<g class="rule"><rect x="200" y="348" width="280" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="370" text-anchor="middle" dominant-baseline="central">Proven</text><text class="s" x="340" y="391" text-anchor="middle" dominant-baseline="central">Nothing lacking</text></g>
<path class="wire" d="M340 408 L340 446" marker-end="url(#arrow)"/>
<g class="neutral"><rect x="200" y="448" width="280" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="470" text-anchor="middle" dominant-baseline="central">Landed</text><text class="s" x="340" y="491" text-anchor="middle" dominant-baseline="central">With a receipt anyone can re-check</text></g>
<text class="legend" x="340" y="540" text-anchor="middle">Purple: the bar and rules · Green: mechanical checks · Red: never trusted</text>
</svg>