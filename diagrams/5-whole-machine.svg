<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820" role="img" aria-labelledby="mt md"><style>
/* Layout: one diagram, centred, full width on a phone. Same green family as the paper. */
:root{
  --bg:#f5f6f3; --ink:#1b211d; --muted:#5d6760; --line:#8a948c;
  --rule-fill:#ece9fb; --rule-stroke:#5b4fb8; --rule-ink:#2e2770;
  --check-fill:#e1f3ec; --check-stroke:#0f6e56; --check-ink:#08443a;
  --agent-fill:#fbeae4; --agent-stroke:#a8452a; --agent-ink:#5e2414;
  --neutral-fill:#eceeea; --neutral-stroke:#7b847d; --neutral-ink:#1b211d;
  --gap-fill:#faeeda; --gap-stroke:#9a5b0d; --gap-ink:#5a3406;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}}
:root[data-theme="dark"]{--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}
.gap rect{fill:var(--gap-fill);stroke:var(--gap-stroke)} .gap text{fill:var(--gap-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{font-size:17px;font-weight:600}
.s{font-size:14px}
.rule rect{fill:var(--rule-fill);stroke:var(--rule-stroke)} .rule text{fill:var(--rule-ink)}
.check rect{fill:var(--check-fill);stroke:var(--check-stroke)} .check text{fill:var(--check-ink)}
.agent rect{fill:var(--agent-fill);stroke:var(--agent-stroke)} .agent text{fill:var(--agent-ink)}
.neutral rect{fill:var(--neutral-fill);stroke:var(--neutral-stroke)} .neutral text{fill:var(--neutral-ink)}
.wire{fill:none;stroke:var(--line);stroke-width:1.5}
.legend{fill:var(--muted);font-size:13px}

text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
:root{background:var(--bg)}
</style><rect width="100%" height="100%" fill="var(--bg)"/><title id="mt">The whole Pullboard machine</title><desc id="md">Borrowed and seeded trust feed a record of the git tree and event log. Fixed rules derive every verdict. Objectives, pace and capacity are settings. An untrusted builder's change passes the checks and becomes a landed unit. Units are proven again together into a release, receipts are hash-linked from a signed genesis, and anyone can verify them.</desc>
<defs><marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="neutral"><rect x="50" y="20" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="140" y="42" text-anchor="middle" dominant-baseline="central">Borrowed</text><text class="s" x="140" y="63" text-anchor="middle" dominant-baseline="central">git, crypto</text></g>
<g class="rule"><rect x="250" y="20" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="42" text-anchor="middle" dominant-baseline="central">Signed rules</text><text class="s" x="340" y="63" text-anchor="middle" dominant-baseline="central">By the person, by version</text></g>
<g class="rule"><rect x="450" y="20" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="540" y="42" text-anchor="middle" dominant-baseline="central">The bar</text><text class="s" x="540" y="63" text-anchor="middle" dominant-baseline="central">The person validates it</text></g>
<path class="wire" d="M140 80 L140 100 M540 80 L540 100 M140 100 L540 100"/>
<path class="wire" d="M340 80 L340 118" marker-end="url(#arrow5)"/>
<g class="neutral"><rect x="150" y="120" width="380" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="142" text-anchor="middle" dominant-baseline="central">Record</text><text class="s" x="340" y="163" text-anchor="middle" dominant-baseline="central">git tree + log of facts</text></g>
<path class="wire" d="M340 180 L340 218" marker-end="url(#arrow5)"/>
<g class="rule"><rect x="150" y="220" width="380" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="242" text-anchor="middle" dominant-baseline="central">The rules</text><text class="s" x="340" y="263" text-anchor="middle" dominant-baseline="central">Fixed, named by version</text></g>
<path class="wire" d="M340 280 L340 300 M140 300 L540 300"/>
<path class="wire" d="M140 300 L140 318" marker-end="url(#arrow5)"/>
<path class="wire" d="M340 300 L340 318" marker-end="url(#arrow5)"/>
<path class="wire" d="M540 300 L540 318" marker-end="url(#arrow5)"/>
<g class="neutral"><rect x="50" y="320" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="140" y="342" text-anchor="middle" dominant-baseline="central">Objectives</text><text class="s" x="140" y="363" text-anchor="middle" dominant-baseline="central">What comes first</text></g>
<g class="neutral"><rect x="250" y="320" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="342" text-anchor="middle" dominant-baseline="central">Speed or certainty</text><text class="s" x="340" y="363" text-anchor="middle" dominant-baseline="central">When proof happens</text></g>
<g class="neutral"><rect x="450" y="320" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="540" y="342" text-anchor="middle" dominant-baseline="central">Capacity</text><text class="s" x="540" y="363" text-anchor="middle" dominant-baseline="central">How hard it runs</text></g>
<path class="wire" d="M140 380 L140 400 M540 380 L540 400 M140 400 L540 400"/>
<path class="wire" d="M340 380 L340 400 L140 400 M140 400 L140 418" marker-end="url(#arrow5)"/>
<g class="agent"><rect x="50" y="420" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="140" y="442" text-anchor="middle" dominant-baseline="central">Builder</text><text class="s" x="140" y="463" text-anchor="middle" dominant-baseline="central">Untrusted change</text></g>
<path class="wire" d="M230 450 L248 450" marker-end="url(#arrow5)"/>
<g class="check"><rect x="250" y="420" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="442" text-anchor="middle" dominant-baseline="central">Checks</text><text class="s" x="340" y="463" text-anchor="middle" dominant-baseline="central">Frozen, red, green, review</text></g>
<path class="wire" d="M430 450 L448 450" marker-end="url(#arrow5)"/>
<g class="rule"><rect x="450" y="420" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="540" y="442" text-anchor="middle" dominant-baseline="central">Landed unit</text><text class="s" x="540" y="463" text-anchor="middle" dominant-baseline="central">One rule decides</text></g>
<path class="wire" d="M540 480 L540 500 L340 500 L340 518" marker-end="url(#arrow5)"/>
<g class="check"><rect x="150" y="520" width="380" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="542" text-anchor="middle" dominant-baseline="central">Release</text><text class="s" x="340" y="563" text-anchor="middle" dominant-baseline="central">All units, proven again together</text></g>
<path class="wire" d="M340 580 L340 618" marker-end="url(#arrow5)"/>
<g class="neutral"><rect x="150" y="620" width="380" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="642" text-anchor="middle" dominant-baseline="central">Receipt chain</text><text class="s" x="340" y="663" text-anchor="middle" dominant-baseline="central">Hash-linked; genesis signed</text></g>
<path class="wire" d="M340 680 L340 718" marker-end="url(#arrow5)"/>
<g class="check"><rect x="150" y="720" width="380" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="742" text-anchor="middle" dominant-baseline="central">Anyone verifies</text><text class="s" x="340" y="763" text-anchor="middle" dominant-baseline="central">Re-derive proven, trusting no one</text></g>
<text class="legend" x="340" y="806" text-anchor="middle">Escapes from the checks go back to their owners (see "Where wrong work goes")</text>
</svg>