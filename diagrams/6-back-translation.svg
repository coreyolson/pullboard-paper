<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" role="img" aria-labelledby="bt bd"><style>
/* Layout: one diagram, centred, full width on a phone. Same green family as the paper. */
:root{
  --bg:#f5f6f3; --ink:#1b211d; --muted:#5d6760; --line:#8a948c;
  --rule-fill:#ece9fb; --rule-stroke:#5b4fb8; --rule-ink:#2e2770;
  --check-fill:#e1f3ec; --check-stroke:#0f6e56; --check-ink:#08443a;
  --agent-fill:#fbeae4; --agent-stroke:#a8452a; --agent-ink:#5e2414;
  --neutral-fill:#eceeea; --neutral-stroke:#7b847d; --neutral-ink:#1b211d;
  --gap-fill:#faeeda; --gap-stroke:#9a5b0d; --gap-ink:#5a3406;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}}
:root[data-theme="dark"]{--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}
.gap rect{fill:var(--gap-fill);stroke:var(--gap-stroke)} .gap text{fill:var(--gap-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{font-size:17px;font-weight:600}
.s{font-size:14px}
.rule rect{fill:var(--rule-fill);stroke:var(--rule-stroke)} .rule text{fill:var(--rule-ink)}
.check rect{fill:var(--check-fill);stroke:var(--check-stroke)} .check text{fill:var(--check-ink)}
.agent rect{fill:var(--agent-fill);stroke:var(--agent-stroke)} .agent text{fill:var(--agent-ink)}
.neutral rect{fill:var(--neutral-fill);stroke:var(--neutral-stroke)} .neutral text{fill:var(--neutral-ink)}
.wire{fill:none;stroke:var(--line);stroke-width:1.5}
.legend{fill:var(--muted);font-size:13px}

text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
:root{background:var(--bg)}
</style><rect width="100%" height="100%" fill="var(--bg)"/><title id="bt">Back-translation</title><desc id="bd">The person's request is translated into a test by one agent. A second agent, who sees only the test, translates it back into words, and running the test gives concrete examples. An independent agent compares the request with the words and the examples. A match freezes the test; a mismatch is re-translated, and only what agents cannot settle becomes a ruling for the person.</desc>
<defs><marker id="arrow6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="rule"><rect x="40" y="20" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="130" y="42" text-anchor="middle" dominant-baseline="central">Request</text><text class="s" x="130" y="63" text-anchor="middle" dominant-baseline="central">The person's request</text></g>
<path class="wire" d="M220 50 L248 50" marker-end="url(#arrow6)"/>
<g class="agent"><rect x="250" y="20" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="42" text-anchor="middle" dominant-baseline="central">Translator</text><text class="s" x="340" y="63" text-anchor="middle" dominant-baseline="central">Writes the test</text></g>
<path class="wire" d="M430 50 L458 50" marker-end="url(#arrow6)"/>
<g class="neutral"><rect x="460" y="20" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="550" y="42" text-anchor="middle" dominant-baseline="central">Test</text><text class="s" x="550" y="63" text-anchor="middle" dominant-baseline="central">Not yet frozen</text></g>
<path class="wire" d="M550 80 L550 106 M340 106 L550 106"/>
<path class="wire" d="M340 106 L340 132" marker-end="url(#arrow6)"/>
<path class="wire" d="M550 106 L550 132" marker-end="url(#arrow6)"/>
<g class="agent"><rect x="250" y="134" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="156" text-anchor="middle" dominant-baseline="central">Back-translator</text><text class="s" x="340" y="177" text-anchor="middle" dominant-baseline="central">Sees only the test</text></g>
<g class="check"><rect x="460" y="134" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="550" y="156" text-anchor="middle" dominant-baseline="central">Examples</text><text class="s" x="550" y="177" text-anchor="middle" dominant-baseline="central">The test's cases</text></g>
<path class="wire" d="M130 80 L130 246" marker-end="url(#arrow6)"/>
<path class="wire" d="M340 194 L340 246" marker-end="url(#arrow6)"/>
<path class="wire" d="M550 194 L550 246" marker-end="url(#arrow6)"/>
<g class="agent"><rect x="60" y="248" width="560" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="270" text-anchor="middle" dominant-baseline="central">Compare</text><text class="s" x="340" y="291" text-anchor="middle" dominant-baseline="central">By an independent agent</text></g>
<path class="wire" d="M340 308 L340 328 M220 328 L460 328"/>
<path class="wire" d="M220 328 L220 346" marker-end="url(#arrow6)"/>
<path class="wire" d="M460 328 L460 346" marker-end="url(#arrow6)"/>
<g class="check"><rect x="120" y="348" width="200" height="60" rx="8" stroke-width="1"/><text class="t" x="220" y="370" text-anchor="middle" dominant-baseline="central">Match</text><text class="s" x="220" y="391" text-anchor="middle" dominant-baseline="central">Freeze the test</text></g>
<g class="gap"><rect x="360" y="348" width="200" height="60" rx="8" stroke-width="1"/><text class="t" x="460" y="370" text-anchor="middle" dominant-baseline="central">Mismatch</text><text class="s" x="460" y="391" text-anchor="middle" dominant-baseline="central">Re-translate, or a ruling</text></g>
<text class="legend" x="340" y="442" text-anchor="middle">Purple: the person's request · Red: agents · Green: what runs · Amber: may become a ruling</text>
</svg>
