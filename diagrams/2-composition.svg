<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" role="img" aria-labelledby="ct cd"><style>
/* Layout: one diagram, centred, full width on a phone. Same green family as the paper. */
:root{
  --bg:#f5f6f3; --ink:#1b211d; --muted:#5d6760; --line:#8a948c;
  --rule-fill:#ece9fb; --rule-stroke:#5b4fb8; --rule-ink:#2e2770;
  --check-fill:#e1f3ec; --check-stroke:#0f6e56; --check-ink:#08443a;
  --agent-fill:#fbeae4; --agent-stroke:#a8452a; --agent-ink:#5e2414;
  --neutral-fill:#eceeea; --neutral-stroke:#7b847d; --neutral-ink:#1b211d;
  --gap-fill:#faeeda; --gap-stroke:#9a5b0d; --gap-ink:#5a3406;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}}
:root[data-theme="dark"]{--gap-fill:#4a2f08;--gap-stroke:#efa94a;--gap-ink:#fbe6c4}
.gap rect{fill:var(--gap-fill);stroke:var(--gap-stroke)} .gap text{fill:var(--gap-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121613;--ink:#e3e8e3;--muted:#9aa59d;--line:#7d877f;--rule-fill:#2a2550;--rule-stroke:#a9a1ee;--rule-ink:#e4e1fb;--check-fill:#0f3a30;--check-stroke:#5dcaa5;--check-ink:#d6f3e8;--agent-fill:#4a2015;--agent-stroke:#ef9b7d;--agent-ink:#fbe2d8;--neutral-fill:#222924;--neutral-stroke:#8a948c;--neutral-ink:#e3e8e3;color-scheme:dark}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{font-size:17px;font-weight:600}
.s{font-size:14px}
.rule rect{fill:var(--rule-fill);stroke:var(--rule-stroke)} .rule text{fill:var(--rule-ink)}
.check rect{fill:var(--check-fill);stroke:var(--check-stroke)} .check text{fill:var(--check-ink)}
.agent rect{fill:var(--agent-fill);stroke:var(--agent-stroke)} .agent text{fill:var(--agent-ink)}
.neutral rect{fill:var(--neutral-fill);stroke:var(--neutral-stroke)} .neutral text{fill:var(--neutral-ink)}
.wire{fill:none;stroke:var(--line);stroke-width:1.5}
.legend{fill:var(--muted);font-size:13px}

text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
:root{background:var(--bg)}
</style><rect width="100%" height="100%" fill="var(--bg)"/><title id="ct">How proven units combine into a release</title><desc id="cd">Three units are each proven on their own base; unit C is built on A. They merge into one combined tree. Every unit's bar is proven again on that exact tree. The release counts as proven only when every unit and the release bar hold, and its receipt names every unit in it.</desc>
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="rule"><rect x="50" y="20" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="140" y="42" text-anchor="middle" dominant-baseline="central">Unit A</text><text class="s" x="140" y="63" text-anchor="middle" dominant-baseline="central">Proven on its base</text></g>
<g class="rule"><rect x="250" y="20" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="42" text-anchor="middle" dominant-baseline="central">Unit B</text><text class="s" x="340" y="63" text-anchor="middle" dominant-baseline="central">Proven on its base</text></g>
<g class="rule"><rect x="450" y="20" width="180" height="60" rx="8" stroke-width="1"/><text class="t" x="540" y="42" text-anchor="middle" dominant-baseline="central">Unit C</text><text class="s" x="540" y="63" text-anchor="middle" dominant-baseline="central">Built on A's tree</text></g>
<path class="wire" d="M140 80 L140 106 M540 80 L540 106 M140 106 L540 106"/>
<path class="wire" d="M340 80 L340 132" marker-end="url(#arrow2)"/>
<g class="neutral"><rect x="200" y="134" width="280" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="156" text-anchor="middle" dominant-baseline="central">Combined tree</text><text class="s" x="340" y="177" text-anchor="middle" dominant-baseline="central">One merge of A, B and C</text></g>
<path class="wire" d="M340 194 L340 232" marker-end="url(#arrow2)"/>
<g class="check"><rect x="160" y="234" width="360" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="256" text-anchor="middle" dominant-baseline="central">Proven again, together</text><text class="s" x="340" y="277" text-anchor="middle" dominant-baseline="central">Every unit's bar on the merged tree</text></g>
<path class="wire" d="M340 294 L340 332" marker-end="url(#arrow2)"/>
<g class="rule"><rect x="200" y="334" width="280" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="356" text-anchor="middle" dominant-baseline="central">Release landed</text><text class="s" x="340" y="377" text-anchor="middle" dominant-baseline="central">Every unit + the release bar</text></g>
<path class="wire" d="M340 394 L340 432" marker-end="url(#arrow2)"/>
<g class="neutral"><rect x="200" y="434" width="280" height="60" rx="8" stroke-width="1"/><text class="t" x="340" y="456" text-anchor="middle" dominant-baseline="central">Release receipt</text><text class="s" x="340" y="477" text-anchor="middle" dominant-baseline="central">Names every unit in it</text></g>
<text class="legend" x="340" y="534" text-anchor="middle">Units combine like gates: all-of for a release, after-of for dependencies</text>
</svg>